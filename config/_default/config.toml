# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

theme = "congo"

baseURL = "https://datanalyze.be/"

# French is the primary language and is served at the root (/).
# English is served under /en/.
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
paginate = 10
summaryLength = 0

# Aucun contenu ne déclare d'alias, donc les désactiver est gratuit.
#
# ATTENTION — cette clé ne supprime PAS le stub meta-refresh que Hugo écrit à
# /fr/ quand defaultContentLanguageInSubdir vaut false. Le fichier est toujours
# produit : le build compte « Aliases | 1 | 0 » et public/fr/index.html existe.
# C'est la règle forcée « /fr/ -> / 301! » de static/_redirects qui le
# court-circuite, et elle seule — comme le dit le commentaire de ce fichier-là.
disableAliases = true

# Ne pas publier « <meta name="generator" content="Hugo x.y.z"> » : la version
# exacte du générateur n'apporte rien au visiteur et renseigne un attaquant.
disableHugoGeneratorInject = true

# Le wrapper blogdown : ces fichiers ne sont pas du contenu Hugo.
#
# ATTENTION — cette clé doit rester AU-DESSUS de tout en-tête [table], comme
# cloudflareAnalyticsToken dans params.toml. Elle vivait jusqu'ici en fin de
# fichier, après [markup], donc TOML la rattachait à cette table : Hugo lisait
# markup.goldmark.renderer.ignoreFiles, une clé inconnue qu'il ignorait en
# silence. L'exclusion des .Rmd n'a donc jamais été active.
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]

[outputs]
  home = ["HTML", "RSS"]
