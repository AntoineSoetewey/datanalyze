# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

theme = "congo"

baseURL = "https://datanalyze.be/"

# French is the primary language and is served at the root (/).
# English is served under /en/.
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false

googleAnalytics = "G-0FTNWH4KFK"

enableRobotsTXT = true
paginate = 10
summaryLength = 0

# When defaultContentLanguageInSubdir is false, Hugo emits an HTML meta-refresh
# alias at /fr/. That file would shadow the "/fr/ -> / 301" rule in
# static/_redirects (Netlify only applies an unforced rule when no file matches),
# and a meta refresh passes far less signal than a 301. No content declares
# aliases of its own, so disabling them is free.
disableAliases = true

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
