# -- Theme Options --
# These options control how the theme functions and allow you to
# customise the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/configuration/#theme-parameters

colorScheme = "datanalyze"

# -- Audience measurement --
# The site ships with zero measurement script and zero cookie. See README.md and
# layouts/partials/analytics.html.
#
# Cloudflare Web Analytics is prepared but NOT active: it is free, cookieless and
# needs no consent banner. Paste the token here to switch it on; while this is an
# empty string, no script whatsoever is emitted, and the "audience measurement"
# paragraph of the privacy policy stays hidden.
#
# NOTE: this key must stay ABOVE every [table] header in this file, or TOML would
# nest it inside the preceding table and the toggle would silently never fire.
cloudflareAnalyticsToken = ""
defaultAppearance = "light" # valid options: light or dark
autoSwitchAppearance = false

# -- Deferred sections --
# Built and styled, but not displayed: there are no testimonials, no client
# logos and no rate card yet, and none may be invented. Flip a flag to true AND
# create the matching data file to switch one on. Each partial's header comment
# has the exact steps.
showTestimonials = false
showClientLogos = false
showPricing = false

enableSearch = false
enableCodeCopy = false
enableImageLazyLoading = true

# robots = ""
fingerprintAlgorithm = "sha256"

[header]
  # "custom" loads layouts/partials/header/custom.html — Congo's sanctioned
  # extension point, so the header is NOT a shadowed theme file.
  layout = "custom"
  # logo = "img/logo.jpg"
  # logoDark = "img/dark-logo.jpg"
  showTitle = true
  
[footer]
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = false
  showScrollToTop = false

[homepage]
  layout = "page" # valid options: page, profile, custom
  showRecent = false
  recentLimit = 5

[article]
  showDate = false
  showDateUpdated = false
  showAuthor = false
  showBreadcrumbs = true
  showDraftLabel = false
  showEdit = false
  # editURL = "https://github.com/AntoineSoetewey/antoinesoetewey.com/"
  editAppendPath = true
  showHeadingAnchors = false
  showPagination = false
  invertPagination = false
  showReadingTime = false
  showTableOfContents = false
  showTaxonomies = false
  showWordCount = false
  showComments = false
  # sharingLinks = ["facebook", "twitter", "pinterest", "reddit", "linkedin", "email"]

[list]
  showBreadcrumbs = false
  showSummary = false
  showTableOfContents = false
  showTaxonomies = false
  groupByYear = false
  paginationWidth = 1

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true

# -- Search engine verification --
# Leave empty until the property is claimed, then paste the meta-tag value.
# Both are free. See TODO-CONTENU.md for the step-by-step.
[verification]
  google = ""  # Google Search Console — the main source of traffic data
  bing = ""    # Bing Webmaster Tools
